<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Tracker - MapleStory Classic</title>
<style>
  :root {
    --bg: #17130f;
    --panel: #211b15;
    --panel-2: #2a221a;
    --line: #3a2f24;
    --text: #f1e7d8;
    --muted: #a8977f;
    --accent: #f0a23a;
    --accent-ink: #2a1a05;
    --good: #7fd08a;
    --bad: #ef7d6b;
    --exp: #8fc7ef;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 20px; align-items: start; }
  .grid > * { min-width: 0; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } body { padding: 14px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font: inherit; font-variant-numeric: tabular-nums;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .row.three { grid-template-columns: 90px 1fr; }
  .field { margin-bottom: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 17px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 9px 14px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.small { padding: 5px 9px; font-size: 12px; font-weight: 500; }
  button.big { width: 100%; padding: 13px; font-size: 16px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns > button { flex: 1; }

  .timer { text-align: center; padding: 6px 0 16px; }
  .clock { font-size: 58px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; line-height: 1.1; }
  .clock.paused { color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
  .dot.paused { background: var(--accent); }
  .dot.done { background: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .dot.live { animation: pulse 1.6s infinite; } }
  @keyframes pulse { 50% { opacity: .35; } }
  .meta { font-size: 13px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .startinfo { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .startinfo span { color: var(--muted); display: block; font-size: 11px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .v.mesos { color: var(--accent); } .v.exp { color: var(--exp); }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .tabs button { font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .tabs .spacer { flex: 1; }
  .tabs select { width: auto; padding: 7px 10px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  tbody tr:hover { background: var(--panel-2); }
  td small { color: var(--muted); display: block; font-size: 11px; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .warn { background: #3a2412; border: 1px solid #6b4318; color: #f6cf9a; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; width: min(560px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 16px; font-size: 17px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Farm Tracker</span> MapleStory Classic</h1>
    <div class="tools">
      <button class="small" id="btnManual">+ Sessão manual</button>
      <button class="small" id="btnExport">Exportar backup</button>
      <button class="small" id="btnImport">Importar backup</button>
      <button class="small" id="btnCsv">Exportar CSV</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
    </div>
  </header>

  <div id="storageWarn" class="warn" hidden>Este navegador não está deixando salvar dados para este arquivo. O que você registrar some ao fechar a página. Use "Exportar backup" antes de fechar.</div>

  <div class="grid">
    <section class="card" id="grindCard" aria-live="polite"></section>

    <section>
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="sessions" aria-selected="true">Sessões</button>
          <button role="tab" data-tab="days" aria-selected="false">Por dia</button>
          <button role="tab" data-tab="monsters" aria-selected="false">Por monstro</button>
          <span class="spacer"></span>
          <select id="charFilter" aria-label="Filtrar por personagem"></select>
        </div>
        <div class="scroll" id="tableBox"></div>
      </div>
      <footer>Os dados ficam salvos neste navegador, neste computador. Faça um backup de vez em quando.</footer>
    </section>
  </div>
</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">Editar sessão</h3>
    <div class="row">
      <div><label for="eChar">Personagem</label><input id="eChar" list="charList" required></div>
      <div><label for="eMonster">Monstro</label><input id="eMonster" list="monsterList"></div>
    </div>
    <div class="row">
      <div><label for="eStart">Início</label><input id="eStart" type="datetime-local" required></div>
      <div><label for="eEnd">Fim</label><input id="eEnd" type="datetime-local" required></div>
    </div>
    <div class="field"><label for="eMin">Minutos de grind (sem as pausas)</label><input id="eMin" inputmode="numeric" data-num></div>
    <div class="row">
      <div><label for="eMesosStart">Mesos início</label><input id="eMesosStart" inputmode="numeric" data-num required></div>
      <div><label for="eMesosEnd">Mesos fim</label><input id="eMesosEnd" inputmode="numeric" data-num required></div>
    </div>
    <div class="row three">
      <div><label for="eLvStart">Lv início</label><input id="eLvStart" inputmode="numeric" data-num required></div>
      <div><label for="eExpStart">EXP início</label><input id="eExpStart" inputmode="numeric" data-num required></div>
    </div>
    <div class="row three">
      <div><label for="eLvEnd">Lv fim</label><input id="eLvEnd" inputmode="numeric" data-num required></div>
      <div><label for="eExpEnd">EXP fim</label><input id="eExpEnd" inputmode="numeric" data-num required></div>
    </div>
    <div class="field"><label for="eNotes">Notas</label><textarea id="eNotes"></textarea></div>
    <div class="btns">
      <button type="button" id="eCancel">Cancelar</button>
      <button type="button" class="danger" id="eDelete">Excluir</button>
      <button type="submit" class="primary">Salvar</button>
    </div>
  </form>
</dialog>

<datalist id="charList"></datalist>
<datalist id="monsterList"></datalist>

<script>
"use strict";
/* EXP para o proximo nivel, niveis 1 a 99 (MapleStory Classic, tabela do MeowDB). */
const EXP_NEED = [0,15,34,57,92,135,372,560,840,1242,1716,2360,3216,4200,5460,7050,8840,11040,13716,16680,20216,24402,28980,34320,40512,47216,54900,63666,73080,83720,95700,108480,122760,138666,155540,174216,194832,216600,240500,266682,294216,324240,356916,391160,428280,468450,510420,555680,604416,655200,709716,748608,789631,832902,878545,926689,977471,1031036,1087536,1147132,1209994,1276301,1346242,1420016,1497832,1579913,1666492,1757815,1854143,1955750,2062925,2175973,2295216,2420993,2553663,2693603,2841212,2996910,3161140,3334370,3517093,3709829,3913127,4127566,4353756,4592341,4844001,5109452,5389449,5684790,11938059,25069923,52646838,110558359,232172553,487562361,1023880958,2150150011,4515315023,9482161548];
const EXP_CUM = [0, 0];
for (let l = 2; l <= 100; l++) EXP_CUM[l] = EXP_CUM[l - 1] + EXP_NEED[l - 1];

const KEY = "farmTrackerMaple.v1";
const local = (y, mo, d, h, mi) => new Date(y, mo - 1, d, h, mi).getTime();
const SEED = {
  sessions: [
    { id: "seed1", char: "Abell", monster: "Wraiths lv 48", start: local(2026,11,14,10,18), end: local(2026,11,14,11,7),  mesosStart: 2583000, mesosEnd: 2616000, lvStart: 53, expStart: 4453,   lvEnd: 53, expEnd: 145463, notes: "" },
    { id: "seed2", char: "Abell", monster: "Lupin lv 37",   start: local(2026,11,14,11,18), end: local(2026,11,14,12,22), mesosStart: 2616000, mesosEnd: 2634000, lvStart: 53, expStart: 145463, lvEnd: 53, expEnd: 251223, notes: "" },
    { id: "seed3", char: "Abell", monster: "Wraiths lv 48", start: local(2026,11,14,15,35), end: local(2026,11,14,18,11), mesosStart: 2634314, mesosEnd: 2692279, lvStart: 53, expStart: 251223, lvEnd: 53, expEnd: 605695, notes: "" }
  ],
  active: null,
  chars: ["Abell"],
  draft: { char: "Abell", monster: "Wraiths lv 48" }
};
SEED.sessions.forEach(s => { s.activeMs = s.end - s.start; });

let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.sessions)) return normalize(d); }
  } catch (e) { storageOk = false; }
  return normalize(JSON.parse(JSON.stringify(SEED)));
}
function normalize(d) {
  d.sessions = d.sessions || []; d.chars = d.chars || []; d.draft = d.draft || {}; d.active = d.active || null;
  d.sessions.forEach(s => { if (!d.chars.includes(s.char)) d.chars.push(s.char); });
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
  document.getElementById("storageWarn").hidden = storageOk;
}
let state = load();
let ui = { tab: "sessions", filter: "", finishing: false };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
const fmt = n => (n == null || !isFinite(n)) ? "" : nf.format(Math.round(n));
const signed = n => (n > 0 ? "+" : "") + fmt(n);
const num = v => { const t = String(v == null ? "" : v).replace(/[^\d-]/g, ""); return t === "" || t === "-" ? null : parseInt(t, 10); };
const pad = n => String(n).padStart(2, "0");
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const dayLabel = k => { const p = k.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };
const toLocalInput = ts => { const d = new Date(ts); return dayKey(ts) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); };
const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + "h " + pad(m % 60) + "min"; };
const validLv = l => Number.isInteger(l) && l >= 1 && l <= 100;
const pct = (lv, exp) => (validLv(lv) && lv < 100 && exp != null) ? exp / EXP_NEED[lv] * 100 : null;
const pctTxt = (lv, exp) => { const p = pct(lv, exp); return p == null ? "" : p.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%"; };
const expGain = s => (validLv(s.lvStart) && validLv(s.lvEnd)) ? EXP_CUM[s.lvEnd] + s.expEnd - EXP_CUM[s.lvStart] - s.expStart : null;
const perHour = (v, ms) => (v == null || !ms) ? null : v / (ms / 3600000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const activeElapsed = a => (a.pauseStartedAt || Date.now()) - a.startTs - a.pausedMs;
const lastOf = ch => state.sessions.filter(s => s.char === ch).sort((a, b) => b.end - a.end)[0];
const monsters = () => [...new Set(state.sessions.map(s => s.monster).filter(Boolean))];

function bindNumInputs(root) {
  root.querySelectorAll("input[data-num]").forEach(inp => {
    inp.addEventListener("input", () => {
      const n = num(inp.value);
      inp.value = n == null ? "" : (inp.hasAttribute("data-plain") ? String(n) : fmt(n));
    });
  });
}
function bindPctHint(lvId, expId, hintId) {
  const upd = () => {
    const lv = num($(lvId).value), exp = num($(expId).value), h = $(hintId);
    if (lv == null || exp == null) { h.textContent = ""; return; }
    if (!validLv(lv)) { h.textContent = "Level fora da tabela (1 a 100)."; return; }
    if (lv < 100 && exp >= EXP_NEED[lv]) { h.textContent = "Acima do total do level " + lv + " (" + fmt(EXP_NEED[lv]) + ")."; return; }
    h.textContent = pctTxt(lv, exp) + " do level " + lv;
  };
  $(lvId).addEventListener("input", upd); $(expId).addEventListener("input", upd); upd();
}

/* ---------- grind card ---------- */
function renderGrind() {
  const el = $("grindCard"), a = state.active;
  if (!a) {
    const d = state.draft || {};
    const ch = d.char || state.chars[0] || "";
    const last = lastOf(ch);
    const v = (k, fb) => d[k] != null ? d[k] : fb;
    el.innerHTML = `
      <h2>Novo grind</h2>
      <div class="row">
        <div><label for="gChar">Personagem</label>
          <select id="gChar">${state.chars.map(c => `<option${c === ch ? " selected" : ""}>${esc(c)}</option>`).join("")}<option value="__new">+ Novo personagem</option></select></div>
        <div><label for="gMonster">Monstro</label><input id="gMonster" list="monsterList" value="${esc(v("monster", last ? last.monster : ""))}"></div>
      </div>
      <div class="field"><label for="gMesos">Mesos agora</label><input id="gMesos" inputmode="numeric" data-num value="${fmt(v("mesosStart", last ? last.mesosEnd : null))}"></div>
      <div class="row three">
        <div><label for="gLv">Level</label><input id="gLv" inputmode="numeric" data-num data-plain value="${v("lvStart", last ? last.lvEnd : "") ?? ""}"></div>
        <div><label for="gExp">EXP agora</label><input id="gExp" inputmode="numeric" data-num value="${fmt(v("expStart", last ? last.expEnd : null))}"></div>
      </div>
      <div class="hint" id="gHint"></div>
      <div class="hint" id="gErr" style="color:var(--bad)"></div>
      <button class="primary big" id="gStart">Iniciar grind</button>
      <div class="hint">Os campos já vêm com os valores do fim da última sessão do personagem. Confira antes de iniciar.</div>`;
    bindNumInputs(el); bindPctHint("gLv", "gExp", "gHint");
    const keep = () => { state.draft = { char: $("gChar").value, monster: $("gMonster").value, mesosStart: num($("gMesos").value), lvStart: num($("gLv").value), expStart: num($("gExp").value) }; save(); };
    ["gMonster", "gMesos", "gLv", "gExp"].forEach(id => $(id).addEventListener("change", keep));
    $("gChar").addEventListener("change", () => {
      let c = $("gChar").value;
      if (c === "__new") {
        c = (prompt("Nome do novo personagem:") || "").trim();
        if (!c) { renderGrind(); return; }
        if (!state.chars.includes(c)) state.chars.push(c);
      }
      state.draft = { char: c }; save(); renderAll();
    });
    $("gStart").addEventListener("click", () => {
      const s = { char: $("gChar").value, monster: $("gMonster").value.trim(), mesosStart: num($("gMesos").value), lvStart: num($("gLv").value), expStart: num($("gExp").value) };
      if (s.mesosStart == null || s.expStart == null || !validLv(s.lvStart)) { $("gErr").textContent = "Preencha mesos, level (1 a 100) e EXP para iniciar."; return; }
      state.active = Object.assign(s, { startTs: Date.now(), pausedMs: 0, pauseStartedAt: null });
      state.draft = { char: s.char, monster: s.monster }; ui.finishing = false; save(); renderAll();
    });
    return;
  }
  const paused = !!a.pauseStartedAt;
  const info = `
    <div class="startinfo">
      <div><span>Personagem</span>${esc(a.char)}</div>
      <div><span>Monstro</span>${esc(a.monster || "não informado")}</div>
      <div><span>Mesos início</span>${fmt(a.mesosStart)}</div>
      <div><span>EXP início</span>Lv ${a.lvStart}, ${fmt(a.expStart)} (${pctTxt(a.lvStart, a.expStart)})</div>
    </div>`;
  if (!ui.finishing) {
    el.innerHTML = `
      <h2>Grind em andamento</h2>
      <div class="timer">
        <div class="status"><i class="dot ${paused ? "paused" : "live"}"></i>${paused ? "Pausado" : "Contando"}</div>
        <div class="clock ${paused ? "paused" : ""}" id="clock">${clock(activeElapsed(a))}</div>
        <div class="meta">Início às <b>${hm(a.startTs)}</b>${dayKey(a.startTs) !== dayKey(Date.now()) ? " de " + dayLabel(dayKey(a.startTs)) : ""}<span id="pauseMeta"></span></div>
      </div>
      ${info}
      <div class="btns">
        <button id="gPause">${paused ? "Retomar" : "Pausar"}</button>
        <button class="primary" id="gFinish">Finalizar grind</button>
      </div>
      <div class="hint" style="margin-top:10px"><button class="small danger" id="gDiscard">Descartar este grind</button></div>`;
    $("gPause").addEventListener("click", togglePause);
    $("gFinish").addEventListener("click", () => { if (!a.pauseStartedAt) a.pauseStartedAt = Date.now(); a.finishAt = a.pauseStartedAt; ui.finishing = true; save(); renderGrind(); });
    $("gDiscard").addEventListener("click", () => { if (confirm("Descartar o grind em andamento? O tempo contado será perdido.")) { state.active = null; save(); renderAll(); } });
    tick();
  } else {
    el.innerHTML = `
      <h2>Finalizar grind</h2>
      <div class="timer">
        <div class="status"><i class="dot done"></i>Tempo de grind</div>
        <div class="clock">${clock(activeElapsed(a))}</div>
        <div class="meta">Das <b>${hm(a.startTs)}</b> às <b>${hm(a.pauseStartedAt)}</b>${a.pausedMs >= 60000 ? ", com " + dur(a.pausedMs) + " de pausa" : ""}</div>
      </div>
      ${info}
      <div class="field"><label for="fMesos">Mesos agora</label><input id="fMesos" inputmode="numeric" data-num></div>
      <div class="row three">
        <div><label for="fLv">Level</label><input id="fLv" inputmode="numeric" data-num data-plain value="${a.lvStart}"></div>
        <div><label for="fExp">EXP agora</label><input id="fExp" inputmode="numeric" data-num></div>
      </div>
      <div class="hint" id="fHint"></div>
      <div class="field"><label for="fNotes">Notas (opcional)</label><input id="fNotes"></div>
      <div class="hint" id="fErr" style="color:var(--bad)"></div>
      <div class="btns">
        <button id="fBack">Voltar ao grind</button>
        <button class="primary" id="fSave">Salvar sessão</button>
      </div>`;
    bindNumInputs(el); bindPctHint("fLv", "fExp", "fHint");
    $("fMesos").focus();
    $("fBack").addEventListener("click", () => { a.pausedMs += Date.now() - a.pauseStartedAt; a.pauseStartedAt = null; delete a.finishAt; ui.finishing = false; save(); renderGrind(); });
    $("fSave").addEventListener("click", () => {
      const mesosEnd = num($("fMesos").value), lvEnd = num($("fLv").value), expEnd = num($("fExp").value);
      if (mesosEnd == null || expEnd == null || !validLv(lvEnd)) { $("fErr").textContent = "Preencha mesos, level (1 a 100) e EXP para salvar."; return; }
      state.sessions.push({ id: uid(), char: a.char, monster: a.monster, start: a.startTs, end: a.pauseStartedAt, activeMs: activeElapsed(a),
        mesosStart: a.mesosStart, mesosEnd, lvStart: a.lvStart, expStart: a.expStart, lvEnd, expEnd, notes: $("fNotes").value.trim() });
      state.active = null; state.draft = { char: a.char, monster: a.monster }; ui.finishing = false; save(); renderAll();
    });
  }
}
function togglePause() {
  const a = state.active; if (!a) return;
  if (a.pauseStartedAt) { a.pausedMs += Date.now() - a.pauseStartedAt; a.pauseStartedAt = null; }
  else a.pauseStartedAt = Date.now();
  save(); renderGrind();
}
function tick() {
  const a = state.active, c = $("clock");
  if (!a || !c || ui.finishing) return;
  c.textContent = clock(activeElapsed(a));
  const pm = $("pauseMeta");
  const p = a.pausedMs + (a.pauseStartedAt ? Date.now() - a.pauseStartedAt : 0);
  if (pm) pm.textContent = p >= 60000 ? ", " + dur(p) + " de pausa" : "";
  document.title = (a.pauseStartedAt ? "Pausado " : "") + clock(activeElapsed(a)) + " - Farm Tracker";
}
setInterval(tick, 1000);

/* ---------- stats and tables ---------- */
const filtered = () => state.sessions.filter(s => !ui.filter || s.char === ui.filter).sort((a, b) => b.start - a.start);
function agg(list) {
  const t = { n: list.length, ms: 0, lucro: 0, exp: 0 };
  list.forEach(s => { t.ms += s.activeMs; t.lucro += s.mesosEnd - s.mesosStart; t.exp += expGain(s) || 0; });
  return t;
}
function renderStats() {
  const list = filtered(), t = agg(list), today = agg(list.filter(s => dayKey(s.start) === dayKey(Date.now())));
  const cell = (k, v, cls) => `<div class="stat"><div class="k">${k}</div><div class="v ${cls || ""}">${v || "0"}</div></div>`;
  $("stats").innerHTML =
    cell("Lucro total", signed(t.lucro), "mesos") + cell("Mesos/h médio", fmt(perHour(t.lucro, t.ms)), "mesos") +
    cell("EXP total", fmt(t.exp), "exp") + cell("EXP/h médio", fmt(perHour(t.exp, t.ms)), "exp") +
    cell("Tempo de grind", dur(t.ms)) + cell("Hoje", signed(today.lucro) + " mesos");
}
function groupTable(keyFn, labelFn, head) {
  const groups = new Map();
  filtered().forEach(s => { const k = keyFn(s); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); });
  if (!groups.size) return `<div class="empty">Nenhuma sessão registrada.</div>`;
  const rows = [...groups.entries()].map(([k, l]) => ({ k, t: agg(l) }));
  if (head === "Monstro") rows.sort((a, b) => (perHour(b.t.lucro, b.t.ms) || 0) - (perHour(a.t.lucro, a.t.ms) || 0));
  return `<table><thead><tr><th>${head}</th><th>Sessões</th><th>Tempo</th><th>Lucro</th><th>Mesos/h</th><th>EXP ganho</th><th>EXP/h</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(labelFn(r.k))}</td><td>${r.t.n}</td><td>${dur(r.t.ms)}</td><td class="${r.t.lucro < 0 ? "neg" : "pos"}">${signed(r.t.lucro)}</td><td>${fmt(perHour(r.t.lucro, r.t.ms))}</td><td>${fmt(r.t.exp)}</td><td>${fmt(perHour(r.t.exp, r.t.ms))}</td></tr>`).join("") +
    `</tbody></table>`;
}
function renderTable() {
  const box = $("tableBox");
  if (ui.tab === "days") { box.innerHTML = groupTable(s => dayKey(s.start), dayLabel, "Data"); return; }
  if (ui.tab === "monsters") { box.innerHTML = groupTable(s => s.monster || "(sem monstro)", k => k, "Monstro"); return; }
  const list = filtered();
  if (!list.length) { box.innerHTML = `<div class="empty">Nenhuma sessão registrada. Inicie um grind ao lado.</div>`; return; }
  box.innerHTML = `<table><thead><tr><th>Data</th><th class="l">Personagem</th><th class="l">Monstro</th><th>Horário</th><th>Tempo</th><th>Mesos</th><th>Lucro</th><th>Mesos/h</th><th>EXP</th><th>EXP ganho</th><th>EXP/h</th><th></th></tr></thead><tbody>` +
    list.map(s => {
      const lucro = s.mesosEnd - s.mesosStart, g = expGain(s);
      return `<tr title="${esc(s.notes)}">
        <td>${dayLabel(dayKey(s.start))}</td><td class="l">${esc(s.char)}</td><td class="l">${esc(s.monster)}${s.notes ? `<small>${esc(s.notes)}</small>` : ""}</td>
        <td>${hm(s.start)} a ${hm(s.end)}</td><td>${dur(s.activeMs)}</td>
        <td>${fmt(s.mesosEnd)}<small>de ${fmt(s.mesosStart)}</small></td>
        <td class="${lucro < 0 ? "neg" : "pos"}">${signed(lucro)}</td><td>${fmt(perHour(lucro, s.activeMs))}</td>
        <td>Lv ${s.lvEnd} ${pctTxt(s.lvEnd, s.expEnd)}<small>de Lv ${s.lvStart} ${pctTxt(s.lvStart, s.expStart)}</small></td>
        <td>${fmt(g)}</td><td>${fmt(perHour(g, s.activeMs))}</td>
        <td><button class="small" data-edit="${esc(s.id)}">Editar</button></td></tr>`;
    }).join("") + `</tbody></table>`;
  box.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openEdit(b.dataset.edit)));
}
function renderLists() {
  $("charList").innerHTML = state.chars.map(c => `<option value="${esc(c)}">`).join("");
  $("monsterList").innerHTML = monsters().map(m => `<option value="${esc(m)}">`).join("");
  $("charFilter").innerHTML = `<option value="">Todos os personagens</option>` + state.chars.map(c => `<option${c === ui.filter ? " selected" : ""}>${esc(c)}</option>`).join("");
}
function renderAll() { renderLists(); renderGrind(); renderStats(); renderTable(); if (!state.active) document.title = "Farm Tracker - MapleStory Classic"; }

document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
  ui.tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  renderTable();
}));
$("charFilter").addEventListener("change", e => { ui.filter = e.target.value; renderStats(); renderTable(); });

/* ---------- edit / manual ---------- */
let editingId = null;
function openEdit(id) {
  editingId = id;
  const s = id ? state.sessions.find(x => x.id === id) : null;
  const last = lastOf((state.draft && state.draft.char) || state.chars[0]);
  const now = Date.now();
  $("editTitle").textContent = s ? "Editar sessão" : "Sessão manual";
  $("eDelete").hidden = !s;
  $("eChar").value = s ? s.char : ((state.draft && state.draft.char) || state.chars[0] || "");
  $("eMonster").value = s ? s.monster : (last ? last.monster : "");
  $("eStart").value = toLocalInput(s ? s.start : now - 3600000);
  $("eEnd").value = toLocalInput(s ? s.end : now);
  $("eMin").value = s ? Math.round(s.activeMs / 60000) : "";
  $("eMesosStart").value = fmt(s ? s.mesosStart : (last ? last.mesosEnd : null));
  $("eMesosEnd").value = s ? fmt(s.mesosEnd) : "";
  $("eLvStart").value = s ? s.lvStart : (last ? last.lvEnd : "");
  $("eExpStart").value = fmt(s ? s.expStart : (last ? last.expEnd : null));
  $("eLvEnd").value = s ? s.lvEnd : (last ? last.lvEnd : "");
  $("eExpEnd").value = s ? fmt(s.expEnd) : "";
  $("eNotes").value = s ? s.notes || "" : "";
  $("editDlg").showModal();
}
bindNumInputs($("editDlg"));
$("btnManual").addEventListener("click", () => openEdit(null));
$("eCancel").addEventListener("click", () => $("editDlg").close());
$("eDelete").addEventListener("click", () => {
  if (!confirm("Excluir esta sessão? Não dá para desfazer.")) return;
  state.sessions = state.sessions.filter(x => x.id !== editingId); save(); $("editDlg").close(); renderAll();
});
$("editForm").addEventListener("submit", e => {
  e.preventDefault();
  const orig = editingId ? state.sessions.find(x => x.id === editingId) : null;
  /* Os campos de data so tem precisao de minuto: se nao foram alterados, mantem o horario original. */
  const pick = (id, o) => (orig && $(id).value === toLocalInput(o)) ? o : new Date($(id).value).getTime();
  const start = pick("eStart", orig && orig.start), end = pick("eEnd", orig && orig.end);
  const lvStart = num($("eLvStart").value), lvEnd = num($("eLvEnd").value);
  if (!isFinite(start) || !isFinite(end) || end <= start) { alert("O fim precisa ser depois do início."); return; }
  if (!validLv(lvStart) || !validLv(lvEnd)) { alert("Level precisa estar entre 1 e 100."); return; }
  const min = num($("eMin").value);
  const s = { id: editingId || uid(), char: $("eChar").value.trim() || "Sem nome", monster: $("eMonster").value.trim(), start, end,
    activeMs: (min != null && min > 0) ? Math.min(min * 60000, end - start) : end - start,
    mesosStart: num($("eMesosStart").value) || 0, mesosEnd: num($("eMesosEnd").value) || 0,
    lvStart, expStart: num($("eExpStart").value) || 0, lvEnd, expEnd: num($("eExpEnd").value) || 0, notes: $("eNotes").value.trim() };
  const i = state.sessions.findIndex(x => x.id === s.id);
  if (i >= 0) state.sessions[i] = s; else state.sessions.push(s);
  if (!state.chars.includes(s.char)) state.chars.push(s.char);
  save(); $("editDlg").close(); renderAll();
});

/* ---------- backup ---------- */
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("btnExport").addEventListener("click", () => download("farm-tracker-backup-" + dayKey(Date.now()) + ".json", JSON.stringify(state, null, 2), "application/json"));
$("btnImport").addEventListener("click", () => $("fileImport").click());
$("fileImport").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.sessions)) throw new Error("formato");
      if (!confirm("Importar " + d.sessions.length + " sessões e substituir os dados atuais?")) return;
      state = normalize(d); ui.finishing = false; save(); renderAll();
    } catch (err) { alert("Este arquivo não é um backup válido do Farm Tracker."); }
    e.target.value = "";
  };
  r.readAsText(f);
});
$("btnCsv").addEventListener("click", () => {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["Data", "Personagem", "Monstro", "Hora início", "Hora fim", "Minutos", "Mesos início", "Mesos fim", "Lucro", "Lv início", "EXP início", "Lv fim", "EXP fim", "EXP ganho", "Notas"];
  const rows = state.sessions.slice().sort((a, b) => a.start - b.start).map(s =>
    [dayLabel(dayKey(s.start)), s.char, s.monster, hm(s.start), hm(s.end), Math.round(s.activeMs / 60000), s.mesosStart, s.mesosEnd, s.mesosEnd - s.mesosStart, s.lvStart, s.expStart, s.lvEnd, s.expEnd, expGain(s), s.notes].map(q).join(";"));
  download("farm-tracker-" + dayKey(Date.now()) + ".csv", "﻿" + [head.map(q).join(";")].concat(rows).join("\r\n"), "text/csv");
});

if (state.active && state.active.finishAt) ui.finishing = true;
renderAll();
save();
</script>
</body>
</html>
